<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Updating Drift</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<style>
@font-face{font-family:"Drift Sans";font-weight:400 700;font-stretch:75% 100%;src:url(../renderer/shared/fonts/instrument-latin.woff2) format("woff2-variations")}
@font-face{font-family:"Drift Display";font-weight:200 800;font-stretch:75% 100%;src:url(../renderer/shared/fonts/bricolage-latin.woff2) format("woff2-variations")}
:root{--bg:#0f1e24;--water:#0b171c;--fg:#e4efec;--mut:#94adab;--faint:#6c8986;--line:#335862;--a:#f2c230;--ink:#1a1500;--b:#6fd3bf;--err:#ff8a7a}
@media (prefers-color-scheme:light){:root{--bg:#eef3f2;--water:#e2eae9;--fg:#0e2a31;--mut:#4d6a6e;--faint:#7a9396;--line:#b7c9c8;--a:#8f6200;--ink:#fff;--b:#0f7f78;--err:#c2392a}}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:14px/1.5 "Drift Sans","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--fg);background:linear-gradient(180deg,var(--bg) 0 64%,var(--water) 64%);overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
#card{position:absolute;inset:0;border:1px solid var(--line);padding:26px 30px 24px;display:flex;flex-direction:column;-webkit-app-region:drag}
.wm{font:720 16px/1 "Drift Display",system-ui;font-stretch:88%;letter-spacing:-.035em;color:var(--mut);margin-bottom:16px}
.wm i{font-style:normal;background:radial-gradient(circle at center,var(--a) 0 58%,transparent 64%) 50% .04em/.22em .22em no-repeat}
h1{font:600 24px/1.15 "Drift Display",system-ui;font-stretch:88%;letter-spacing:-.015em}
#detail{color:var(--mut);margin:6px 0 0;min-height:42px;font-size:13.5px;word-break:break-word;user-select:text}
.tide{position:relative;height:16px;margin-top:auto}
.tide::before{content:'';position:absolute;left:0;right:0;top:7px;height:1px;background:var(--line)}
.tide b{position:absolute;left:0;top:6px;height:3px;width:2%;border-radius:2px;background:var(--a);transition:width .35s ease}
.tide u{position:absolute;top:1px;left:2%;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:var(--a);box-shadow:0 0 0 4px var(--bg);transition:left .35s ease}
.tide.busy u{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-2px)}}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
.hint{margin-top:6px;color:var(--faint);font-size:12px}
button{-webkit-app-region:no-drag;display:none;margin-top:14px;align-self:flex-start;height:36px;border:0;border-radius:9px;padding:0 18px;font:600 13px "Drift Sans",system-ui;color:var(--ink);cursor:pointer;background:var(--a)}
.error h1{color:var(--err)}.error .tide b,.error .tide u{background:var(--err)}.error button{display:block}
.done .tide b,.done .tide u{background:var(--b)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="card">
  <div class="wm">Dr<i>ı</i>ft</div>
  <h1 id="title">Updating Drift</h1>
  <div id="detail">Getting ready…</div>
  <div class="tide busy" id="track"><b id="bar"></b><u id="buoy"></u></div>
  <div class="row"><span id="step">Starting</span><span id="pct">0%</span></div>
  <div class="hint" id="hint">Keep this window open. Drift reopens by itself with your tabs.</div>
  <button id="close" onclick="setup.closeUpdate()">Close</button>
</div>
<script>
const $=id=>document.getElementById(id);
const LABEL={wait:'Starting',close:'Closing Drift',copy:'Installing files',swap:'Switching versions',launch:'Opening Drift',verify:'Checking the new version',rollback:'Restoring the previous version',done:'Finished',error:'Stopped'};
setup.onUpdateState(s=>{
  if(s.title)$('title').textContent=s.title;
  if(s.detail!==undefined)$('detail').textContent=s.detail;
  const pct=Math.max(2,Math.min(100,Math.round(s.pct||0)));
  $('bar').style.width=pct+'%';$('buoy').style.left=pct+'%';$('pct').textContent=pct+'%';$('step').textContent=LABEL[s.step]||'Working';
  const card=$('card');card.classList.toggle('error',!!s.error);card.classList.toggle('done',s.step==='done');
  $('track').classList.toggle('busy',s.step!=='done'&&!s.error);
  $('hint').textContent=s.error?'Your previous version of Drift has been reopened. Details: %APPDATA%\\Drift\\Updates\\updater.log':s.step==='done'?'':'Keep this window open. Drift reopens by itself with your tabs.';
});
</script></body></html>
