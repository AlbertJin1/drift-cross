<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
<title>New tab — Drift</title>
<link rel="stylesheet" href="tailwind.generated.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="page-wrap flex flex-col items-center w-full min-w-0">
    <div class="topline">
      <div class="brand"><img src="assets/drift-mark.svg" alt=""><span>Drift browser</span></div>
      <div class="clock"><div id="day"></div><div id="clock"></div></div>
    </div>
    <section class="hero">
      <h1>Find your flow.</h1>
      <p class="tagline">A quieter, faster way to move around the web.</p>
      <form id="f" class="search-form" autocomplete="off" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.5"/><path d="m16.4 16.4 4.2 4.2"/></svg>
        <input id="q" placeholder="Search or enter a website address" autofocus spellcheck="false" aria-label="Search or enter a website address">
        <button class="go" type="submit" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
      </form>
    </section>
    <section class="section" aria-label="Shortcuts">
      <div class="section-head"><span class="section-title">Quick access</span><span class="section-hint">Your essentials, one click away</span></div>
      <div class="tiles" id="tiles"></div>
    </section>
    <div class="bottom-hint"><span>Command palette <kbd id="k">Ctrl K</kbd></span><span class="dot"></span><span>Spaces keep work and play separate</span></div>
  </main>
<script src="newtab.js"></script>
</body>
</html>
